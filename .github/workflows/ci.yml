name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python }}
    - run: python -m unittest discover -s tests -v
    - run: python notifier.py --config config.example.toml --check-config
    - run: python scripts/check_public.py
  container:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - run: docker build -t codex-reset-notifier:ci .
    - run: docker run --rm --network none --read-only codex-reset-notifier:ci --check-config
