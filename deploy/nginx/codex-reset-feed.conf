# Include inside your existing HTTPS server block; do not replace that block.
# No arbitrary upstream, path, credentials in query strings, or write methods.
location = /codex-reset-feed {
    if ($scheme != https) { return 404; }
    if ($args !~ "^(before=[1-9][0-9]{0,11})?$") { return 400; }

    auth_basic "Codex reset feed";
    auth_basic_user_file /etc/nginx/auth/codex-reset.htpasswd;
    limit_except GET { deny all; }

    proxy_pass https://t.me/s/codexreset;
    proxy_set_header Host t.me;
    proxy_set_header User-Agent "CodexResetNotifier/1.0";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
    proxy_hide_header Set-Cookie;
    proxy_ssl_server_name on;
    proxy_ssl_name t.me;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_redirect off;
    access_log /var/log/nginx/codex-reset-feed.access.log combined;
}
